name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: teste Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: ffmpeg (cu libass + libx264)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: dependențe
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[server,reframe,tts,dev]'

      - name: pytest
        run: pytest -q

  web:
    name: build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: build imagine Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vedit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pornește containerul și verifică /api/health și /
        run: |
          docker run -d --name vedit -p 8000:8000 vedit:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/ | grep -q '<div id="root">'
      - name: loguri container (la eșec)
        if: failure()
        run: docker logs vedit
