<style>
  #sl { position: absolute; inset: 0; }
  #sl canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<script>
/* speed_lines: fundal de benzi desenate (linii de viteză radiale spre un centru), pe tot ecranul. Cu behind=true pe un
   clip cu persoana: „comic burst” în spatele ei. P.x, P.y (centrul, 0..1; implicit fața); P.tone light (alb, linii
   negre) | dark (negru, linii albe) | accent (accent, linii albe); P.density (40-200 de linii). Liniile se schimbă la
   fiecare 2 cadre (ca desenul animat), iar centrul rămâne gol în jurul persoanei. */
function build(V) {
  var P = V.P;
  var host = V.el("div"); host.id = "sl";
  var cv = document.createElement("canvas"); cv.width = V.W; cv.height = V.H; host.appendChild(cv);
  var g = cv.getContext("2d");
  var f = V.face;
  var cx = (P.x != null ? P.x : f ? f.x + f.w / 2 : .5) * V.W, cy = (P.y != null ? P.y : f ? f.y + f.h * .8 : .45) * V.H;
  var tone = P.tone || "light";
  var css = getComputedStyle(document.documentElement);
  var accent = css.getPropertyValue("--accent").trim() || "#E8B04B";
  var bg = tone === "dark" ? "#0B0B0D" : tone === "accent" ? accent : "#FAFAF7";
  var ink = tone === "light" ? "#111111" : "#FFFFFF";
  var nLines = Math.max(40, Math.min(200, P.density || 110));
  var diag = Math.hypot(V.W, V.H);
  var hole = (f ? Math.max(f.w * V.W * 1.6, 16 * V.u) : 22 * V.u);
  function draw(frame) {
    var seed = 1 + Math.floor(frame / 2) * 7919;  // alt desen la 2 cadre
    function r() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
    g.fillStyle = bg; g.fillRect(0, 0, V.W, V.H);
    g.fillStyle = ink;
    for (var i = 0; i < nLines; i++) {
      var a = r() * Math.PI * 2, w = (0.15 + r() * 0.9) * Math.PI / nLines;
      var inner = hole * (1 + r() * 1.4);
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      g.lineTo(cx + Math.cos(a - w) * diag, cy + Math.sin(a - w) * diag);
      g.lineTo(cx + Math.cos(a + w) * diag, cy + Math.sin(a + w) * diag);
      g.closePath(); g.fill();
    }

  }
  var clock = { t: 0 };
  V.tl.fromTo(clock, { t: 0 }, { t: V.DUR, duration: V.DUR, ease: "none", onUpdate: function () {
    draw(Math.round(clock.t * 30));
  } }, 0);
  draw(0);
  // intră cu un flash scurt (scale din centru), iese tăiat: e un cadru de benzi desenate, nu o tranziție lentă
  V.tl.fromTo(host, { scale: 1.25, opacity: 0 }, { scale: 1, opacity: 1, duration: .14, ease: "power2.out",
              transformOrigin: cx + "px " + cy + "px" }, 0);
  V.noExit = true;
  V.tl.set(host, { opacity: 0 }, V.DUR - 0.001);
}
</script>
