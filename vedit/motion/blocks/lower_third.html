<style>
  #lt { position: absolute; left: 6%; display: flex; align-items: stretch; gap: calc(var(--u)*1.6); }
  #bar { width: calc(var(--u)*.6); background: var(--accent); border-radius: 9px; transform-origin: center bottom; }
  #name { font-size: calc(var(--u)*5); line-height: 1.05; }
  #role { font-size: calc(var(--u)*2.9); margin-top: calc(var(--u)*.6); letter-spacing: .02em; }
  #txt { padding: calc(var(--u)*.4) 0; overflow: hidden; }
  .shade { position: absolute; left: 0; right: 0; height: 40%; background: linear-gradient(to top, rgba(0,0,0,.45), rgba(0,0,0,0)); }
</style>
<script>
/* lower_third: numele și rolul, linia de accent crește, textul iese din spatele ei. */
function build(V) {
  var P = V.P;
  var top = (P.position || (V.vertical ? "top" : "bottom")) === "top";
  var sh = V.el("div", "shade");
  if (top) { sh.style.top = 0; sh.style.background = "linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0))"; } else sh.style.bottom = 0;
  var lt = V.el("div"); lt.id = "lt";
  if (top) lt.style.top = V.vertical ? "12%" : "9%"; else lt.style.bottom = V.vertical ? "22%" : "11%";
  var bar = V.el("div", "", lt); bar.id = "bar";
  var txt = V.el("div", "", lt); txt.id = "txt";
  var name = V.text(V.el("div", "display free", txt), P.name); name.id = "name";
  var role = P.role ? V.text(V.el("div", "body free-muted", txt), P.role) : null;
  if (role) role.id = "role";
  V.fit(name, V.W * 0.8, 0, 12);
  V.tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: .55 }, 0);
  V.tl.fromTo(name, { x: -6 * V.u, opacity: 0, filter: "blur(" + V.blur * .5 + "px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: .75 }, 0.18);
  if (role) V.tl.fromTo(role, { x: -4 * V.u, opacity: 0 }, { x: 0, opacity: 1, duration: .7 }, 0.32);
}
</script>
