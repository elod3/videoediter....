<style>
  .shade { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.78), rgba(0,0,0,.35) 80%); }
  #q { position: absolute; left: 9%; right: 9%; top: 50%; transform: translateY(-50%); text-align: center; }
  #mark { font-family: "Instrument Serif", serif; font-size: calc(var(--u)*22); line-height: .6; color: var(--accent); height: calc(var(--u)*9); }
  #text { font-family: "Instrument Serif", serif; font-weight: 400; font-size: calc(var(--u)*7.4); line-height: 1.08; color: var(--ink-free); text-shadow: 0 .03em .35em rgba(0,0,0,.35); }
  .vert #text { font-size: calc(var(--u)*8.6); }
  #text i { font-style: italic; color: var(--accent); }
  #author { font-size: calc(var(--u)*3); color: var(--muted-free); margin-top: calc(var(--u)*3); letter-spacing: .12em; text-transform: uppercase; }
</style>
<script>
/* quote: ghilimeaua cade, citatul apare cuvânt cu cuvânt în serif, autorul la final. */
function build(V) {
  var P = V.P;
  if (V.vertical) document.getElementById("stage").classList.add("vert");
  V.el("div", "shade");
  var q = V.el("div"); q.id = "q";
  var mark = V.text(V.el("div", "", q), "“"); mark.id = "mark";
  var t = V.el("div", "", q); t.id = "text";
  var words = V.words(t, P.text, [], "color");
  V.fit(t, V.W * 0.82, V.H * 0.56, 12);
  var a = P.author ? V.text(V.el("div", "body", q), "— " + P.author) : null;
  if (a) a.id = "author";
  V.tl.fromTo(mark, { opacity: 0, y: -3 * V.u, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: .7, ease: "vPop" }, 0);
  V.reveal(words.map(function (w) { return w.word; }), 0.2, { stagger: Math.min(0.08, 1.2 / Math.max(words.length, 1)), y: V.u * 1.2 });
  if (a) V.reveal(a, 0.45 + words.length * 0.06, { y: V.u });
}
</script>
