<style>
  #cap { position: absolute; left: 7%; right: 7%; text-align: center; display: flex; flex-wrap: wrap; justify-content: center;
         line-height: 1.12; font-family: var(--font-body); font-weight: var(--w-body); font-stretch: var(--stretch-body); }
  /* spațiul dintre cuvinte e pe cuvânt (em-ul cuvântului), nu pe rând: altfel ar fi minuscul */
  .w { display: inline-block; position: relative; white-space: pre; margin: 0 .14em; }
  .w.em .t { font-family: var(--font-accent); font-style: italic; font-weight: 400; font-size: 1.12em; letter-spacing: 0; }
  .w .mk { position: absolute; left: -.08em; right: -.08em; top: .12em; bottom: .02em; background: var(--accent); border-radius: .12em;
           z-index: -1; transform-origin: left center; }
  .line .w, .marker .w { font-size: calc(var(--u)*5.6); }
  .chunk .w { font-size: calc(var(--u)*8.4); }
  .vert.line .w, .vert.marker .w { font-size: calc(var(--u)*6.4); }
  .vert.chunk .w { font-size: calc(var(--u)*8); }
  .sh { text-shadow: 0 .04em .28em rgba(0,0,0,.55), 0 0 .06em rgba(0,0,0,.5); }
  .chunk .w { -webkit-text-stroke: .045em #000; paint-order: stroke fill; }
  /* registers: bucăți scurte; cuvântul-cheie pe rândul lui, uriaș și condensat, restul mic deasupra / dedesubt */
  .rg { position: absolute; left: 6%; right: 6%; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .rg .row { display: flex; flex-wrap: wrap; justify-content: center; }
  .rg .w { font-size: calc(var(--u)*5); font-family: var(--font-body); font-weight: 700; }
  .rg .big { display: inline-block; font-family: var(--font-huge); font-weight: 400; color: var(--accent); line-height: .86; white-space: nowrap;
             font-size: calc(var(--u)*19); text-shadow: 0 .03em .2em rgba(0,0,0,.35); }
</style>
<script>
/* captions (intern): o frază de subtitrare, sincronizată pe cuvinte. P.words, P.starts, P.ends (secunde din frază),
   P.emph (indicii cuvintelor-cheie), P.mode: line | chunk | marker | registers, P.y (0..1, centrul textului). */
function build(V) {
  var P = V.P, st = document.getElementById("stage");
  V.noExit = true;
  var mode = P.mode || "line";
  st.classList.add(mode);
  if (V.vertical) st.classList.add("vert");
  var cap = V.el("div", "display"); cap.id = "cap";
  cap.style.top = ((P.y || (V.vertical ? 0.68 : 0.8)) * 100) + "%";
  cap.style.transform = "translateY(-50%)";
  var words = P.words || [], starts = P.starts || [], ends = P.ends || [], emph = P.emph || [];
  var els = words.map(function (w, i) {
    var e = V.el("span", "w free sh" + (emph.indexOf(i) >= 0 && V.S.font_accent ? " em" : ""), cap);
    if (mode === "marker" && emph.indexOf(i) < 0) { var m = V.el("span", "mk", e); m.style.opacity = 0; }
    var t = V.el("span", "t", e); V.text(t, mode === "chunk" ? String(w).toUpperCase() : w);
    return { e: e, t: t, mk: e.querySelector(".mk") };
  });
  var acc = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#ffd400";
  if (mode === "registers") {
    cap.style.display = "none";
    // bucăți de max 4 cuvinte, rupte la pauze sau după cuvântul-cheie; fiecare bucată are cel mult un cuvânt mare
    var groups = [], g = [];
    words.forEach(function (w, i) {
      var gap = i > 0 ? starts[i] - ends[i - 1] : 0;
      var hasBig = g.some(function (j) { return emph.indexOf(j) >= 0; });
      if (g.length && (g.length >= 4 || gap > 0.3 || (hasBig && emph.indexOf(i) >= 0))) { groups.push(g); g = []; }
      g.push(i);
    });
    if (g.length) groups.push(g);
    groups.forEach(function (ch, c) {
      var box = V.el("div", "rg"); box.style.top = ((P.y || (V.vertical ? 0.66 : 0.76)) * 100) + "%";
      box.style.transform = "translateY(-50%)";
      var bi = ch.filter(function (j) { return emph.indexOf(j) >= 0; })[0];
      var pre = V.el("div", "row", box), mid = bi != null ? V.el("div", "", box) : null, post = V.el("div", "row", box);
      var items = ch.map(function (j) {
        if (j === bi) { var b = V.el("div", "big", mid); V.text(b, String(words[j]).toUpperCase());
          if (/[ĂÂÎ]/.test(b.textContent)) b.style.paddingTop = ".16em";  // căciulițele nu urcă în rândul de sus V.fit(b, V.W * .86, 0, 20); return { j: j, e: b, big: true }; }
        var e = V.el("span", "w free sh", bi == null || j < bi ? pre : post); V.text(e, words[j]); return { j: j, e: e };
      });
      var a = starts[ch[0]], end = c + 1 < groups.length ? starts[groups[c + 1][0]] : V.DUR;
      V.tl.set(box, { opacity: 0 }, 0);
      V.tl.set(box, { opacity: 1 }, Math.max(0, a - .04));
      items.forEach(function (x) {
        var at = Math.max(0, starts[x.j] - (x.big ? .03 : .06));
        if (x.big) V.tl.fromTo(x.e, { opacity: 0, scale: 1.35, filter: "blur(" + V.u * 1.6 + "px)" },
                                { opacity: 1, scale: 1, filter: "blur(0px)", duration: .26, ease: "vIn" }, at);
        else V.tl.fromTo(x.e, { opacity: 0, y: V.u * .8, filter: "blur(" + V.u * .7 + "px)" },
                         { opacity: 1, y: 0, filter: "blur(0px)", duration: .22, ease: "vIn" }, at);
      });
      V.tl.to(box, { opacity: 0, duration: .08 }, Math.max(a, end - .08));
    });
    return;
  }
  if (mode === "chunk") {
    // bucăți de max 3 cuvinte, rupte la pauze: fiecare bucată apare cu pop și dispare când vine următoarea
    var chunks = [], cur = [];
    words.forEach(function (w, i) {
      var gap = i > 0 ? starts[i] - ends[i - 1] : 0;
      if (cur.length && (cur.length >= 3 || gap > 0.25)) { chunks.push(cur); cur = []; }
      cur.push(i);
    });
    if (cur.length) chunks.push(cur);
    els.forEach(function (x) { gsap.set(x.e, { display: "none" }); });
    chunks.forEach(function (ch, c) {
      var a = starts[ch[0]], b = c + 1 < chunks.length ? starts[chunks[c + 1][0]] : V.DUR;
      ch.forEach(function (i) {
        V.tl.set(els[i].e, { display: "inline-block" }, a);
        V.tl.set(els[i].e, { display: "none" }, b);
        V.tl.fromTo(els[i].e, { scale: .7, opacity: 0 }, { scale: 1, opacity: 1, duration: .16, ease: "vPop" }, a);
        var col = emph.indexOf(i) >= 0 ? acc : "#ffffff";
        V.tl.set(els[i].t, { color: "#ffffff" }, a);
        V.tl.to(els[i].t, { color: emph.indexOf(i) >= 0 ? acc : "#ffe14d", duration: .05 }, starts[i]);
        V.tl.fromTo(els[i].e, { scale: 1 }, { scale: 1.09, duration: .08, yoyo: true, repeat: 1, ease: "power2.out" }, starts[i]);
        if (i + 1 < words.length && ch.indexOf(i + 1) >= 0) V.tl.to(els[i].t, { color: col === acc ? acc : "#ffffff", duration: .05 }, starts[i + 1]);
      });
    });
  } else if (mode === "marker") {
    V.tl.fromTo(cap, { opacity: 0, y: V.u }, { opacity: 1, y: 0, duration: .25 }, 0);
    els.forEach(function (x, i) {
      if (emph.indexOf(i) >= 0) V.tl.set(x.t, { color: acc }, 0);
      if (!x.mk) return;
      V.tl.fromTo(x.mk, { scaleX: 0, opacity: .9 }, { scaleX: 1, opacity: .9, duration: .14, ease: "vIn" }, starts[i]);
      V.tl.to(x.mk, { opacity: 0, duration: .12 }, ends[i] + .05);
    });
    V.tl.to(cap, { opacity: 0, duration: .15 }, Math.max(.2, V.DUR - .15));
  } else {
    // line: fraza se scrie pe măsură ce e spusă; fiecare cuvânt vine din blur, cuvintele-cheie în accent
    els.forEach(function (x, i) {
      if (emph.indexOf(i) >= 0) gsap.set(x.t, { color: acc });
      V.tl.fromTo(x.e, { opacity: 0, y: V.u * .9, filter: "blur(" + V.u * .9 + "px)" },
                  { opacity: 1, y: 0, filter: "blur(0px)", duration: .28, ease: "vIn" }, Math.max(0, starts[i] - .06));
    });
    V.tl.to(cap, { opacity: 0, filter: "blur(" + V.u * .6 + "px)", duration: .18 }, Math.max(.2, V.DUR - .18));
  }
}
</script>
