<style>
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, var(--bg2), var(--bg) 72%); }
  #wrap { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
  #logo { position: relative; overflow: hidden; }
  #logo img { display: block; max-width: calc(var(--W) * .56); max-height: calc(var(--H) * .26); object-fit: contain; }
  .vert #logo img { max-width: calc(var(--W) * .72); }
  #shine { position: absolute; inset: 0; -webkit-mask-size: contain; -webkit-mask-repeat: no-repeat;
           -webkit-mask-position: center; overflow: hidden; }
  #sweep { position: absolute; top: -20%; bottom: -20%; width: 34%; transform: skewX(-18deg);
           background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); }
  #tag { font-size: calc(var(--u)*3.6); color: var(--muted); margin-top: calc(var(--u)*3.4); letter-spacing: .18em; text-transform: uppercase; }
  #line { width: calc(var(--u)*12); height: calc(var(--u)*.35); background: var(--accent); margin-top: calc(var(--u)*2.6); border-radius: 9px; }
</style>
<script>
/* logo_reveal: logo-ul clientului (images.logo) se descoperă dintr-o mască, o dungă de lumină trece peste el,
   apoi linia de accent și sloganul. P.tagline, P.transparent (fără fundal: peste video). */
function build(V) {
  var P = V.P;
  if (V.vertical) document.getElementById("stage").classList.add("vert");
  if (!P.transparent) V.el("div").id = "bg";
  var wrap = V.el("div"); wrap.id = "wrap";
  var box = V.el("div", "", wrap); box.id = "logo";
  var img = document.createElement("img"); img.src = V.img("logo"); box.appendChild(img);
  // lumina trece doar peste forma logo-ului: masca e chiar logo-ul
  var shine = V.el("div", "", box); shine.id = "shine";
  shine.style.webkitMaskImage = "url(" + JSON.stringify(V.img("logo")) + ")";
  var sw = V.el("div", "", shine); sw.id = "sweep";
  var line = V.el("div", "", wrap); line.id = "line";
  var tag = P.tagline ? V.text(V.el("div", "body free-muted", wrap), P.tagline) : null;
  if (tag) tag.id = "tag";
  V.tl.fromTo(box, { clipPath: "inset(0 50% 0 50%)", scale: 1.12, filter: "blur(" + V.blur + "px)" },
              { clipPath: "inset(0 0% 0 0%)", scale: 1, filter: "blur(0px)", duration: 1.0, ease: "vIn" }, 0.15);
  V.tl.fromTo(sw, { xPercent: -160 }, { xPercent: 420, duration: 1.1, ease: "power2.inOut" }, 0.75);
  V.tl.fromTo(line, { scaleX: 0 }, { scaleX: 1, duration: .6 }, 0.9);
  if (tag) V.reveal(tag, 1.05, { y: V.u });
  V.tl.fromTo(box, { y: 0 }, { y: -V.u * .8, duration: Math.max(.5, V.outAt - 1.2), ease: "none" }, 1.2);
}
</script>
